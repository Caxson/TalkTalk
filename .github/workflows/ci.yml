name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install libopus
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus-dev pkg-config
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: staticcheck
        run: make lint
      - name: test
        run: make cover
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: test web client
        run: make test-web
      - name: build
        run: make build
